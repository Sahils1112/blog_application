version: "3.8"

services:
  client:
    build: ./client
    ports:
      - "3000:80"
    volumes:
      - frontend_access_logs:/var/log/nginx/access
      - frontend_error_logs:/var/log/nginx/error
    depends_on:
      - server
    restart: always
    networks:
      - hybrid

  server:
    build: ./server
    ports:
      - "5003:5003"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DB: ${MONGO_DB}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      NODE_PORT: 5003
    volumes:
      - backend_logs:/app/logs
    restart: always
    networks:
      - hybrid

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
    restart: always
    networks:
      - hybrid

networks:
  hybrid:
    driver: bridge

volumes:
  mongo_data:
  backend_logs:
  frontend_access_logs:
  frontend_error_logs:
